# The ONLY file that changes between the Dev (48GB), Four-bit (80GB) and
# Final (96GB) serving phases.
#
# Dev stack runs on an RTX A6000 48GB (Ampere, sm_86). Checkpoints verified
# 2026-09-16 against the serving requirements of each architecture:
#   agent1  QuantTrio/Qwen3.5-9B-AWQ               ~7GB   4-bit AWQ (mirrors Qwen3.5-9B)
#   agent2  google/gemma-4-12B-it-qat-w4a16-ct     ~9.6GB official QAT 4-bit (compressed-tensors)
#   agent3  cyankiwi/Ministral-3-14B-Instruct-2512-AWQ-4bit  ~8GB  AWQ 4-bit
#           (the official mistralai FP8 checkpoint cannot run on Ampere: vLLM's
#            W8A8 sm80 kernel fails with cutlass_scaled_mm_sm80_epilogue)
#
# `model` is what vLLM serves AND what the OpenAI client sends — do not rename it
# on the server (`--served-model-name` caused 404s in the first serve.sh draft).
# serve.sh commands are generated from this file by scripts/gen_serve_cmds.py,
# so flags can never drift from this config again.

rounds: 3
max_model_len: 4096           # Phase 0 debates are short; raise only with KV headroom
gpu_memory_utilization: 0.90  # sum of the three instances (real card = ~45GB on Vast)

agents:
  - role: "agent1"
    model: "QuantTrio/Qwen3.5-9B-AWQ"
    port: 8000
    quant: "awq_marlin"
    gpu_memory_utilization: 0.28
    max_model_len: 4096
    extra_args:
      - "--reasoning-parser"
      - "qwen3"
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
      - "--language-model-only"   # text-only Phase 0: drop the vision tower
  - role: "agent2"
    model: "google/gemma-4-12B-it-qat-w4a16-ct"
    port: 8001
    quant: "compressed-tensors"
    gpu_memory_utilization: 0.26
    max_model_len: 4096
    extra_args:
      - "--limit-mm-per-prompt"
      - '{"image": 0, "audio": 0}'   # text-only Phase 0: skip MM profiling
  - role: "agent3"
    model: "cyankiwi/Ministral-3-14B-Instruct-2512-AWQ-4bit"
    port: 8002
    quant: "auto"                     # AWQ/compressed-tensors: vLLM detects it; no flag
    gpu_memory_utilization: 0.36
    max_model_len: 4096
    extra_args: []                    # standard HF-format repo; no mistral-format flags

# Four-bit phase (Ph 2b-3) runs on an 80GB card (A100/H100 class). Checkpoints
# and revisions pinned 2026-11-09 from the HF API. Repo totals are 21.04GB
# (Qwen AWQ), 17.23GB (Gemma AWQ) and 15.06GB (Mistral AWQ); budgeted weights
# are 21.0 + 17.2 + 15.06 = 53.26GB, so 80GB x 0.90 leaves ~18.7GB for KV
# cache and activations. scripts/check_stack.py --phase fourbit enforces the
# 80GB card budget.
fourbit_phase:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  agents:
    - role: "agent1"
      model: "cyankiwi/Qwen3.8-27B-AWQ-INT4"
      revision: "e3a700906e6a73ba4290b1873dc2ba8198527ab5"
      port: 8000
      quant: "compressed-tensors"
      weights_gb: 21.0
      gpu_memory_utilization: 0.30
      max_model_len: 8192
      extra_args:
        - "--language-model-only"   # text-only debates: drop the vision tower
        - "--reasoning-parser"
        - "qwen3"
        - "--default-chat-template-kwargs"
        - '{"enable_thinking": false}'
    - role: "agent2"
      model: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
      revision: "5c5db8a7aeabb70b27923ef56536aa5343ecbb5b"
      port: 8001
      quant: "compressed-tensors"
      weights_gb: 17.2
      gpu_memory_utilization: 0.30
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0, "audio": 0}'   # text-only debates: skip MM profiling
    - role: "agent3"
      model: "jeffcookio/Mistral-Small-3.2-24B-Instruct-2506-awq-sym"
      revision: "49ec31ec0975e46a1aeef24186a45f11be3042b8"
      port: 8002
      quant: "auto"
      weights_gb: 15.06
      gpu_memory_utilization: 0.30
      max_model_len: 8192
      extra_args: []                    # standard HF-format repo; no mistral-format flags

# Final phase (Ph 3-5) runs on an RTX PRO 6000 Blackwell 96GB. Checkpoints and
# revisions pinned 2026-11-09 from the HF API. For Qwen `weights_gb` is the
# loaded conservative estimate: 26.93GB body + 2.54GB lm_head + 0.48GB MTP =
# 29.95GB; the 30.87GB FP8 repo also carries a 0.92GB vision tower, which
# --language-model-only drops. scripts/check_stack.py enforces the 96GB
# card budget (96 x 0.90 - 73.68 = 12.72GB budgeted KV).
# Offline preflight is `check_stack.py --phase final` then
# `HF_HUB_OFFLINE=1 python scripts/preflight.py --phase final --offline`;
# the real stack proof is `smoke_test.py --phase final` on the 96GB card.
final_phase:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  agents:
    - role: "agent1"
      model: "Qwen/Qwen3.8-27B-FP8"
      revision: "c3a462cc3d38cf351f3b26cbd763469eeb74ef81"
      port: 8000
      quant: "fp8"
      weights_gb: 29.95
      gpu_memory_utilization: 0.30
      max_model_len: 8192
      extra_args:
        - "--language-model-only"
        - "--reasoning-parser"
        - "qwen3"
        - "--default-chat-template-kwargs"
        - '{"enable_thinking": false}'
    - role: "agent2"
      model: "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
      revision: "ed35d7abe5d940da41b4ff06eb482feb0be8cb44"
      port: 8001
      quant: "compressed-tensors"
      weights_gb: 28.67
      gpu_memory_utilization: 0.34
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0, "audio": 0}'
    - role: "agent3"
      model: "jeffcookio/Mistral-Small-3.2-24B-Instruct-2506-awq-sym"
      revision: "49ec31ec0975e46a1aeef24186a45f11be3042b8"
      port: 8002
      quant: "auto"
      weights_gb: 15.06
      gpu_memory_utilization: 0.26
      max_model_len: 8192
      extra_args: []
