# The ONLY file that changes between Dev (Ph 0-2) and Final (Ph 3-5).
#
# Dev stack runs on an RTX A6000 48GB (Ampere, sm_86). Checkpoints verified
# 2026-09-16 against the serving requirements of each architecture:
#   agent1  QuantTrio/Qwen3.5-9B-AWQ               ~7GB   4-bit AWQ (mirrors Qwen3.5-9B)
#   agent2  google/gemma-4-12B-it-qat-w4a16-ct     ~9.6GB official QAT 4-bit (compressed-tensors)
#   agent3  cyankiwi/Ministral-3-14B-Instruct-2512-AWQ-4bit  ~8GB  AWQ 4-bit
#           (the official mistralai FP8 checkpoint cannot run on Ampere: vLLM's
#            W8A8 sm80 kernel fails with cutlass_scaled_mm_sm80_epilogue)
#
# `model` is what vLLM serves AND what the OpenAI client sends — do not rename it
# on the server (`--served-model-name` caused 404s in the first serve.sh draft).
# serve.sh commands are generated from this file by scripts/gen_serve_cmds.py,
# so flags can never drift from this config again.

rounds: 3
max_model_len: 4096           # Phase 0 debates are short; raise only with KV headroom
gpu_memory_utilization: 0.90  # sum of the three instances (real card = ~45GB on Vast)

agents:
  - role: "agent1"
    model: "QuantTrio/Qwen3.5-9B-AWQ"
    port: 8000
    quant: "awq_marlin"
    gpu_memory_utilization: 0.28
    max_model_len: 4096
    extra_args:
      - "--reasoning-parser"
      - "qwen3"
      - "--default-chat-template-kwargs"
      - '{"enable_thinking": false}'
      - "--language-model-only"   # text-only Phase 0: drop the vision tower
  - role: "agent2"
    model: "google/gemma-4-12B-it-qat-w4a16-ct"
    port: 8001
    quant: "compressed-tensors"
    gpu_memory_utilization: 0.26
    max_model_len: 4096
    extra_args:
      - "--limit-mm-per-prompt"
      - '{"image": 0, "audio": 0}'   # text-only Phase 0: skip MM profiling
  - role: "agent3"
    model: "cyankiwi/Ministral-3-14B-Instruct-2512-AWQ-4bit"
    port: 8002
    quant: "auto"                     # AWQ/compressed-tensors: vLLM detects it; no flag
    gpu_memory_utilization: 0.36
    max_model_len: 4096
    extra_args: []                    # standard HF-format repo; no mistral-format flags

# Final phase (Ph 3-5) runs on an RTX PRO 6000 Blackwell 96GB. Checkpoints and
# revisions pinned 2026-11-08 from the HF API. weights_gb are repo totals, so the
# Qwen figure is the language model only: --language-model-only drops the 6.0GB
# vision tower. scripts/check_stack.py and test_final_stack.py enforce <=80GB and
# a utilization sum <=0.90. Offline preflight is `check_stack.py --phase final`
# then `HF_HUB_OFFLINE=1 python scripts/preflight.py --phase final --offline`;
# the real stack proof is `smoke_test.py --phase final` on the 96GB card.
final_phase:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  agents:
    - role: "agent1"
      model: "Qwen/Qwen3.6-27B-FP8"
      revision: "a56219b8202864dc6d3e565be5ff1eea01f54cb4"
      port: 8000
      quant: "fp8"
      weights_gb: 26.0
      gpu_memory_utilization: 0.30
      max_model_len: 8192
      extra_args:
        - "--language-model-only"
        - "--reasoning-parser"
        - "qwen3"
        - "--default-chat-template-kwargs"
        - '{"enable_thinking": false}'
    - role: "agent2"
      model: "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
      revision: "ed35d7abe5d940da41b4ff06eb482feb0be8cb44"
      port: 8001
      quant: "compressed-tensors"
      weights_gb: 28.67
      gpu_memory_utilization: 0.34
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0, "audio": 0}'
    - role: "agent3"
      model: "jeffcookio/Mistral-Small-3.2-24B-Instruct-2506-awq-sym"
      revision: "49ec31ec0975e46a1aeef24186a45f11be3042b8"
      port: 8002
      quant: "auto"
      weights_gb: 15.06
      gpu_memory_utilization: 0.26
      max_model_len: 8192
      extra_args: []
