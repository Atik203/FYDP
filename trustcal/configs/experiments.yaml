# Experiment matrix — conditions x datasets x seeds. This file is the matrix
# source of truth; datasets.yaml carries revisions and loader defaults only.
# run_matrix.py builds one RunConfig per row and calls trustcal.runner.run().
# CLI filters (--datasets/--arms/--seed/--limit) override the values here.
#
# P0-10 matrix cut (WP-14, 9 Nov 2026): this file is the executable pre-registered
# matrix, not the thesis appendix grid. Four conditions run now:
#   B3            unweighted MAD (no retrieval)
#   B4-matched    arm B4 with the same source partition as B8 (evidence control)
#   B8-no-trust   arm B8 with use_trust=false (primary control)
#   B8            ours (evidence-grounded trust)
# 4 conditions x 3 datasets x 2 seeds = 24 runs. The six-arm target in
# PRE_REGISTRATION.md adds B8-placebo and B8-oracle; those need RunConfig flags
# (`placebo_mode`, `oracle_mode`) from WP-18, so they are deliberately not
# executable here. WP-18 adds a separate configs/experiments_full.yaml; do not
# add the Full arms to this file. The full 15-condition grid lives in the
# commented appendix_conditions block below; re-add it there for the thesis
# appendix, never to this matrix.
#
# Compute check (P0 gate check 13): the gate deliberately uses sample_caps.main
# for every row, so 4 x 3 x 2 x 400 = 9,600 debates x 8 min / 60 = 1,280 GPU-h
# <= 1,500. Per-dataset caps below plan 4 x 2 x (400 + 400 + 200) = 8,000
# debates = 1,067 GPU-h; --limit overrides both maps.
#
# Order discipline (AGENTS.md): Final-stack smoke -> WP-18 (placebo/oracle) ->
# Month-1 pilot -> Core matrix -> Full matrix. Do not run a matrix before the
# pilot gate passes.
#
# `phase` selects the Dev or Final stack from configs/models.yaml; `--phase`
# overrides it. The Month-1 `pilot` arm is deliberately NOT a matrix condition:
# it needs the frozen questions file and must pass Gate 1 before this matrix
# runs. Use `run_experiment.py --arm pilot --questions-file ...` and
# `pilot_report.py`.

datasets:
  # P0-8: the primary matrix is GPQA-Main + MMLU-Pro STEM, with HLE as the
  # ceiling/abstention control. BrokenMath and BrokenArXiv are proof-only
  # (0% answer-type retention) and live in the appendix only — never here.
  - gpqa_main       # primary evidence-grounded set (448; Diamond stays pilot-only)
  - mmlu_pro        # primary scale set (1,000 stratified from 6,696 STEM)
  - hle             # ceiling/abstention control (gated: HF_TOKEN; not positive evidence)

seeds: [1, 2]

# Questions per run when --limit is not given: `pilot` for the pilot arm,
# `main` for every other arm. `main` is also the conservative cap the P0 gate
# multiplies over every dataset, so keep it at the pre-registered 400.
sample_caps:
  pilot: 50
  main: 400

# Per-dataset caps for the matrix plan. A dataset without an entry falls back
# to sample_caps.main. --limit overrides sample_caps and every entry here.
dataset_caps:
  gpqa_main: 400
  mmlu_pro: 400
  hle: 200

conditions:
  B3:
    arm: B3
    description: "MAD (Du et al. 2023) — unweighted multi-agent debate."
  B4-matched:
    arm: B4
    source_partitioning: true
    description: "MAD + RAG, same source partition as B8 — evidence-information control."
  B8-no-trust:
    arm: B8
    use_trust: false
    description: "Primary control: same retriever/prompts/partition as B8 without trust re-weighting (majority aggregation)."
  B8:
    arm: B8
    description: "Ours — trust-calibrated deliberation (evidence-grounded trust during debate)."

