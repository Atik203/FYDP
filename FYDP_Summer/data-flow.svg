<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 960" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E40AF"/>
    </marker>
    <style>
      .lbl { font-size:15px; font-weight:700; fill:#1E40AF; stroke:#ffffff; stroke-width:5; paint-order:stroke; }
      .mid { text-anchor:middle; }
      .start { text-anchor:start; }
      .end { text-anchor:end; }
      .ptitle { font-size:19px; font-weight:800; fill:#ffffff; text-anchor:middle; }
      .ptitle2 { font-size:17px; font-weight:800; fill:#ffffff; text-anchor:middle; }
      .pnum { font-size:16px; font-weight:800; text-anchor:middle; }
      .ent-name { font-size:19px; font-weight:800; fill:#1E40AF; text-anchor:middle; }
      .ent-sub { font-size:14px; font-weight:600; fill:#475569; text-anchor:middle; }
      .store-name { font-size:16px; font-weight:800; fill:#0F172A; text-anchor:middle; }
      .flow { stroke:#1E40AF; stroke-width:4; fill:none; }
      .store-line { stroke:#CBD5E1; stroke-width:2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1720" height="960" fill="#ffffff"/>

  <!-- External entities -->
  <rect x="50" y="50" width="290" height="80" rx="12" fill="#EEF2FF" stroke="#1E40AF" stroke-width="3"/>
  <rect x="56" y="56" width="278" height="68" rx="9" fill="none" stroke="#1E40AF" stroke-width="1.3"/>
  <text x="195" y="86" class="ent-name">Evaluation Harness</text>
  <text x="195" y="110" class="ent-sub">GPQA · MMLU-Pro</text>

  <rect x="420" y="50" width="290" height="80" rx="12" fill="#EEF2FF" stroke="#1E40AF" stroke-width="3"/>
  <rect x="426" y="56" width="278" height="68" rx="9" fill="none" stroke="#1E40AF" stroke-width="1.3"/>
  <text x="565" y="86" class="ent-name">Model Serving</text>
  <text x="565" y="110" class="ent-sub">vLLM + 3 LLMs</text>

  <rect x="1280" y="50" width="380" height="80" rx="12" fill="#EEF2FF" stroke="#1E40AF" stroke-width="3"/>
  <rect x="1286" y="56" width="368" height="68" rx="9" fill="none" stroke="#1E40AF" stroke-width="1.3"/>
  <text x="1470" y="95" class="ent-name">User / Researcher</text>

  <rect x="1230" y="380" width="290" height="80" rx="12" fill="#EEF2FF" stroke="#1E40AF" stroke-width="3"/>
  <rect x="1236" y="386" width="278" height="68" rx="9" fill="none" stroke="#1E40AF" stroke-width="1.3"/>
  <text x="1375" y="416" class="ent-name">Evidence Sources</text>
  <text x="1375" y="440" class="ent-sub" style="font-size:13px">PubMed · arXiv · Semantic Scholar</text>

  <!-- Top row processes -->
  <rect x="50" y="185" width="290" height="80" rx="14" fill="#1E40AF"/>
  <circle cx="85" cy="225" r="17" fill="#ffffff"/>
  <text x="85" y="231" class="pnum" fill="#1E40AF">1</text>
  <text x="207" y="231" class="ptitle">Intake and Gate</text>

  <rect x="420" y="185" width="290" height="80" rx="14" fill="#1E40AF"/>
  <circle cx="455" cy="225" r="17" fill="#ffffff"/>
  <text x="455" y="231" class="pnum" fill="#1E40AF">2</text>
  <text x="580" y="221" class="ptitle2">Debate</text>
  <text x="580" y="243" class="ptitle2">Orchestration</text>

  <rect x="790" y="185" width="290" height="80" rx="14" fill="#1E40AF"/>
  <circle cx="825" cy="225" r="17" fill="#ffffff"/>
  <text x="825" y="231" class="pnum" fill="#1E40AF">3</text>
  <text x="945" y="231" class="ptitle">Claim Decomposition</text>

  <rect x="1160" y="185" width="290" height="80" rx="14" fill="#1E40AF"/>
  <circle cx="1195" cy="225" r="17" fill="#ffffff"/>
  <text x="1195" y="231" class="pnum" fill="#1E40AF">4</text>
  <text x="1315" y="221" class="ptitle2">Retrieval and</text>
  <text x="1315" y="243" class="ptitle2">Verification</text>

  <!-- Bottom row processes -->
  <rect x="50" y="650" width="290" height="80" rx="14" fill="#0F766E"/>
  <circle cx="85" cy="690" r="17" fill="#ffffff"/>
  <text x="85" y="696" class="pnum" fill="#0F766E">5</text>
  <text x="207" y="696" class="ptitle">Trust Update</text>

  <rect x="420" y="650" width="290" height="80" rx="14" fill="#0F766E"/>
  <circle cx="455" cy="690" r="17" fill="#ffffff"/>
  <text x="455" y="696" class="pnum" fill="#0F766E">6</text>
  <text x="580" y="687" class="ptitle2">Weighted</text>
  <text x="580" y="709" class="ptitle2">Aggregation</text>

  <rect x="790" y="650" width="290" height="80" rx="14" fill="#0F766E"/>
  <circle cx="825" cy="690" r="17" fill="#ffffff"/>
  <text x="825" y="696" class="pnum" fill="#0F766E">7</text>
  <text x="945" y="696" class="ptitle">Result Packaging</text>

  <!-- Data stores -->
  <rect x="420" y="420" width="300" height="60" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="3"/>
  <line x1="426" y1="440" x2="714" y2="440" class="store-line"/>
  <text x="570" y="466" class="store-name">D1 Debate State</text>

  <rect x="790" y="420" width="300" height="60" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="3"/>
  <line x1="796" y1="440" x2="1084" y2="440" class="store-line"/>
  <text x="940" y="466" class="store-name" style="font-size:15.5px">D2 Evidence and Verdict Log</text>

  <rect x="790" y="820" width="300" height="60" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="3"/>
  <line x1="796" y1="840" x2="1084" y2="840" class="store-line"/>
  <text x="940" y="866" class="store-name">D3 Results Log</text>

  <!-- Arrows -->
  <line x1="195" y1="132" x2="195" y2="181" class="flow" marker-end="url(#arrow)"/>
  <text x="207" y="162" class="lbl start">question</text>

  <line x1="520" y1="132" x2="520" y2="181" class="flow" marker-end="url(#arrow)"/>
  <text x="505" y="148" class="lbl end">inference requests</text>

  <line x1="620" y1="181" x2="620" y2="132" class="flow" marker-end="url(#arrow)"/>
  <text x="632" y="148" class="lbl start">responses</text>

  <line x1="342" y1="225" x2="416" y2="225" class="flow" marker-end="url(#arrow)"/>
  <text x="380" y="172" class="lbl mid">debate = yes</text>

  <line x1="712" y1="225" x2="786" y2="225" class="flow" marker-end="url(#arrow)"/>
  <text x="750" y="172" class="lbl mid">positions</text>

  <line x1="1082" y1="225" x2="1156" y2="225" class="flow" marker-end="url(#arrow)"/>
  <text x="1120" y="172" class="lbl mid">atomic claims</text>

  <line x1="1300" y1="267" x2="1300" y2="376" class="flow" marker-end="url(#arrow)"/>
  <text x="1310" y="328" class="lbl start">queries</text>

  <line x1="1390" y1="378" x2="1390" y2="269" class="flow" marker-end="url(#arrow)"/>
  <text x="1400" y="328" class="lbl start">passages</text>

  <line x1="560" y1="418" x2="560" y2="269" class="flow" marker-end="url(#arrow)"/>
  <text x="572" y="350" class="lbl start">state</text>

  <polyline points="260,648 260,450 414,450" class="flow" marker-end="url(#arrow)"/>
  <text x="320" y="440" class="lbl mid">trust updates</text>

  <polyline points="1210,267 1210,400 940,400 940,416" class="flow" marker-end="url(#arrow)"/>
  <text x="1030" y="390" class="lbl mid">verdicts</text>

  <path d="M1165,265 C1120,395 1020,455 950,495 C870,540 660,585 300,650" class="flow" marker-end="url(#arrow)"/>
  <text x="850" y="528" class="lbl mid">verdicts</text>

  <line x1="342" y1="690" x2="416" y2="690" class="flow" marker-end="url(#arrow)"/>
  <text x="380" y="622" class="lbl mid">trust updates</text>

  <line x1="712" y1="690" x2="786" y2="690" class="flow" marker-end="url(#arrow)"/>
  <text x="750" y="622" class="lbl mid">answer</text>

  <line x1="940" y1="732" x2="940" y2="816" class="flow" marker-end="url(#arrow)"/>
  <text x="952" y="782" class="lbl start">log</text>

  <polyline points="1080,690 1650,690 1650,134" class="flow" marker-end="url(#arrow)"/>
  <text x="1400" y="679" class="lbl mid">result package</text>
</svg>
