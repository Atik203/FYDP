name: Bug report
description: Report a reproducible defect in the pipeline, site, or build.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private annotations, or model weights. For a security issue, use the private reporting path in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, config, commit, and the smallest input that triggers the problem.
      placeholder: |
        cd trustcal
        python -m pytest src/trustcal/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, GPU, vLLM version, and phase (`dev`, `fourbit`, or `final`).
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact paths, tokens, and private data before pasting.
      render: text
