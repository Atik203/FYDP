<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="50" font-size="40" font-weight="700" fill="#1E3A8A" text-anchor="middle">Record schema and evaluation path</text>
<text x="800" y="84" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">One schema-v2 record per debate; endpoints read the record, never a recomputed answer</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#E2E8F0" stroke-width="2"/>
<rect x="40" y="112" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><path d="M 52 112 H 748 A 12 12 0 0 1 760 124 V 154 H 40 V 124 A 12 12 0 0 1 52 112 Z" fill="#1E3A8A"/><circle cx="66" cy="133" r="14" fill="#FFFFFF"/><text x="66" y="138.04" font-size="16.099999999999998" font-weight="700" fill="#1E3A8A" text-anchor="middle">1</text><text x="90" y="142" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Question &amp; options</text><text x="62" y="188" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">question_id · question</text><text x="62" y="220" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">options_raw → options</text><text x="62" y="252" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">option_permutation (seeded)</text><text x="62" y="284" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">gold_letter_rendered</text><rect x="40" y="332" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><path d="M 52 332 H 748 A 12 12 0 0 1 760 344 V 374 H 40 V 344 A 12 12 0 0 1 52 332 Z" fill="#0F766E"/><circle cx="66" cy="353" r="14" fill="#FFFFFF"/><text x="66" y="358.04" font-size="16.099999999999998" font-weight="700" fill="#0F766E" text-anchor="middle">2</text><text x="90" y="362" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Raw → parsed answer</text><text x="62" y="408" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">raw_answer (model text)</text><text x="62" y="440" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">parsed_answer (canonical choice)</text><text x="62" y="472" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">parser_version</text><rect x="40" y="552" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><path d="M 52 552 H 748 A 12 12 0 0 1 760 564 V 594 H 40 V 564 A 12 12 0 0 1 52 552 Z" fill="#1E3A8A"/><circle cx="66" cy="573" r="14" fill="#FFFFFF"/><text x="66" y="578.04" font-size="16.099999999999998" font-weight="700" fill="#1E3A8A" text-anchor="middle">3</text><text x="90" y="582" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Claims &amp; verdicts</text><text x="62" y="628" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">rounds · transcript</text><text x="62" y="660" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">verdicts: claim · passages · scores</text><text x="62" y="692" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">verdict · verifier · n_claims</text><text x="62" y="724" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">evidence_introduced</text><rect x="840" y="112" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><path d="M 852 112 H 1548 A 12 12 0 0 1 1560 124 V 154 H 840 V 124 A 12 12 0 0 1 852 112 Z" fill="#B91C1C"/><circle cx="866" cy="133" r="14" fill="#FFFFFF"/><text x="866" y="138.04" font-size="16.099999999999998" font-weight="700" fill="#B91C1C" text-anchor="middle">4</text><text x="890" y="142" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Trust trajectory</text><text x="862" y="188" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">trust_trajectory (per scored round)</text><text x="862" y="220" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">trust_for_positions (used by vote)</text><text x="862" y="252" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">trust_status: updated / abstained_*</text><rect x="840" y="332" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><path d="M 852 332 H 1548 A 12 12 0 0 1 1560 344 V 374 H 840 V 344 A 12 12 0 0 1 852 332 Z" fill="#0F766E"/><circle cx="866" cy="353" r="14" fill="#FFFFFF"/><text x="866" y="358.04" font-size="16.099999999999998" font-weight="700" fill="#0F766E" text-anchor="middle">5</text><text x="890" y="362" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Final answer</text><text x="862" y="408" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">final_answer (actual aggregation)</text><text x="862" y="440" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">final_answer_source:</text><text x="862" y="472" font-size="24" font-weight="400" fill="#475569" text-anchor="start">majority · weighted · single · oracle</text><text x="862" y="504" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">final_answer_correct</text><rect x="840" y="552" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><path d="M 852 552 H 1548 A 12 12 0 0 1 1560 564 V 594 H 840 V 564 A 12 12 0 0 1 852 552 Z" fill="#B45309"/><circle cx="866" cy="573" r="14" fill="#FFFFFF"/><text x="866" y="578.04" font-size="16.099999999999998" font-weight="700" fill="#B45309" text-anchor="middle">6</text><text x="890" y="582" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Provenance</text><text x="862" y="628" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">arm · seed · manifest_hash</text><text x="862" y="660" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">run_manifest.json: config hash,</text><text x="862" y="692" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">checkpoints, prompts, revisions, commit</text><line x1="400" y1="310" x2="400" y2="330" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="400" y1="530" x2="400" y2="550" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M 760 650 H 800 V 210 H 838" fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="1200" y1="310" x2="1200" y2="330" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#a-rose)"/><line x1="1200" y1="530" x2="1200" y2="550" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a-teal)"/><text x="40" y="790" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="start">Endpoints</text><rect x="240" y="766" width="120" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="300" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">accuracy</text><rect x="374" y="766" width="90" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="419" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">CMR</text><rect x="478" y="766" width="110" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="533" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">CCR-0</text><rect x="602" y="766" width="110" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="657" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">CCR-E</text><rect x="726" y="766" width="90" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="771" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">ARR</text><rect x="830" y="766" width="110" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="885" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">AUROC</text><rect x="954" y="766" width="90" height="46" rx="23" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="999" y="797.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">Brier</text><text x="40" y="850" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">accuracy carries a question-clustered 95% CI; summary.json keeps raw counts and intervals</text>
</svg>