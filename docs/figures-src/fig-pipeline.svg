ight="600" fill="#0F766E" text-anchor="middle">Mistral-24B</text><text x="593" y="308" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">independent answers + tagged claims</text><rect x="1090" y="112" width="470" height="208" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><path d="M 1102 112 H 1548 A 12 12 0 0 1 1560 124 V 158 H 1090 V 124 A 12 12 0 0 1 1102 112 Z" fill="#1E3A8A"/><circle cx="1118" cy="135" r="15" fill="#FFFFFF"/><text x="1118" y="140.4" font-size="17.25" font-weight="700" fill="#1E3A8A" text-anchor="middle">3</text><text x="1146" y="145" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Claim decomposition</text><text x="1118" y="200" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">answer → atomic claims</text><text x="1118" y="236" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">each claim keeps its agent ID</text><text x="1118" y="272" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">fallback extraction if</text><text x="1118" y="304" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">tagging fails</text><rect x="40" y="356" width="470" height="208" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><path d="M 52 356 H 498 A 12 12 0 0 1 510 368 V 402 H 40 V 368 A 12 12 0 0 1 52 356 Z" fill="#0F766E"/><circle cx="68" cy="379" r="15" fill="#FFFFFF"/><text x="68" y="384.4" font-size="17.25" font-weight="700" fill="#0F766E" text-anchor="middle">4</text><text x="96" y="389" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Claim-domain routing</text><text x="68" y="438" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">bio/clinical → PubMed + S2</text><text x="68" y="472" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">physics/chem, math/CS → arXiv + S2</text><text x="68" y="506" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">other → S2 / OpenAlex</text><text x="68" y="546" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">dedup: DOI · arXiv · title</text><rect x="565" y="356" width="470" height="208" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><path d="M 577 356 H 1023 A 12 12 0 0 1 1035 368 V 402 H 565 V 368 A 12 12 0 0 1 577 356 Z" fill="#B45309"/><circle cx="593" cy="379" r="15" fill="#FFFFFF"/><text x="593" y="384.4" font-size="17.25" font-weight="700" fill="#B45309" text-anchor="middle">5</text><text x="621" y="389" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Verifier</text><rect x="591" y="418" width="150" height="34" rx="17" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/><text x="666" y="444.1" font-size="26" font-weight="600" fill="#15803D" text-anchor="middle">Supported</text><rect x="753" y="418" width="194" height="34" rx="17" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="850" y="444.1" font-size="26" font-weight="600" fill="#B91C1C" text-anchor="middle">Contradicted</text><rect x="591" y="460" width="190" height="34" rx="17" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="686" y="486.1" font-size="26" font-weight="600" fill="#475569" text-anchor="middle">Unverifiable</text><text x="593" y="526" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">bidirectional support check</text><text x="593" y="554" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">per distinct claim</text><rect x="1090" y="356" width="470" height="208" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><path d="M 1102 356 H 1548 A 12 12 0 0 1 1560 368 V 402 H 1090 V 368 A 12 12 0 0 1 1102 356 Z" fill="#B91C1C"/><circle cx="1118" cy="379" r="15" fill="#FFFFFF"/><text x="1118" y="384.4" font-size="17.25" font-weight="700" fill="#B91C1C" text-anchor="middle">6</text><text x="1146" y="389" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Trust update</text><text x="1118" y="446" font-size="28" font-weight="700" fill="#B91C1C" text-anchor="start">S ← S + α·V/n − β·H/n</text><text x="1118" y="484" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">logit → one softmax</text><text x="1118" y="520" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">floor/ceiling simplex</text><text x="1118" y="552" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">projection</text><rect x="40" y="600" width="470" height="208" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><path d="M 52 600 H 498 A 12 12 0 0 1 510 612 V 646 H 40 V 612 A 12 12 0 0 1 52 600 Z" fill="#B45309"/><circle cx="68" cy="623" r="15" fill="#FFFFFF"/><text x="68" y="628.4" font-size="17.25" font-weight="700" fill="#B45309" text-anchor="middle">7</text><text x="96" y="633" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Revision rounds K=3</text><rect x="129" y="660" width="64" height="34" rx="17" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/><text x="161" y="685.4" font-size="24" font-weight="600" fill="#B45309" text-anchor="middle">R0</text><rect x="205" y="660" width="64" height="34" rx="17" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/><text x="237" y="685.4" font-size="24" font-weight="600" fill="#B45309" text-anchor="middle">R1</text><rect x="281" y="660" width="64" height="34" rx="17" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/><text x="313" y="685.4" font-size="24" font-weight="600" fill="#B45309" text-anchor="middle">R2</text><rect x="357" y="660" width="64" height="34" rx="17" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/><text x="389" y="685.4" font-size="24" font-weight="600" fill="#B45309" text-anchor="middle">R3</text><text x="68" y="726" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">retrieve → verdict → trust</text><text x="68" y="758" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">then revised positions</text><rect x="68" y="774" width="414" height="28" rx="14" fill="#FFFFFF" stroke="#B45309" stroke-width="2" stroke-dasharray="7 6"/><text x="275" y="796.4" font-size="24" font-weight="600" fill="#B45309" text-anchor="middle">injection at R2, one shot</text><rect x="565" y="600" width="470" height="208" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><path d="M 577 600 H 1023 A 12 12 0 0 1 1035 612 V 646 H 565 V 612 A 12 12 0 0 1 577 600 Z" fill="#1E3A8A"/><circle cx="593" cy="623" r="15" fill="#FFFFFF"/><text x="593" y="628.4" font-size="17.25" font-weight="700" fill="#1E3A8A" text-anchor="middle">8</text><text x="621" y="633" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Weighted aggregation</text><text x="593" y="692" font-size="27" font-weight="700" fill="#1E3A8A" text-anchor="start">a* = argmax Σ Tᵢ over</text><text x="593" y="728" font-size="27" font-weight="700" fill="#1E3A8A" text-anchor="start">positions</text><text x="593" y="768" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">uses trust_for_positions</text><text x="593" y="798" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">not a headcount</text><rect x="1090" y="600" width="470" height="208" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><path d="M 1102 600 H 1548 A 12 12 0 0 1 1560 612 V 646 H 1090 V 612 A 12 12 0 0 1 1102 600 Z" fill="#0F766E"/><circle cx="1118" cy="623" r="15" fill="#FFFFFF"/><text x="1118" y="628.4" font-size="17.25" font-weight="700" fill="#0F766E" text-anchor="middle">9</text><text x="1146" y="633" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Result package</text><text x="1118" y="688" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">answer + citations</text><text x="1118" y="724" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">trust trajectory</text><text x="1118" y="760" font-size="27" font-weight="400" fill="#0F172A" text-anchor="start">per-agent reasoning</text><text x="1118" y="792" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">auditable decision path</text><line x1="514" y1="216" x2="561" y2="216" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="1039" y1="216" x2="1086" y2="216" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="1325" y1="324" x2="1325" y2="352" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="1086" y1="460" x2="1039" y2="460" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="561" y1="460" x2="514" y2="460" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="275" y1="568" x2="275" y2="596" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="514" y1="704" x2="561" y2="704" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><line x1="1039" y1="704" x2="1086" y2="704" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><text x="40" y="854" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">V supported · H contradicted · n distinct claims · T trust · S2 = Semantic Scholar</text><text x="1560" y="854" font-size="24" font-weight="400" fill="#64748B" text-anchor="end">numbers give the read order</text>
