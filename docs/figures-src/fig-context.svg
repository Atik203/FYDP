<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="50" font-size="40" font-weight="700" fill="#1E3A8A" text-anchor="middle">Why majority vote fails — and how evidence trust corrects it</text>
<text x="800" y="84" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">Same agents, same initial positions; only the aggregation rule changes</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#E2E8F0" stroke-width="2"/>
<rect x="40" y="112" width="740" height="468" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="70" y="154" font-size="34" font-weight="700" fill="#B91C1C" text-anchor="start">A · Majority vote</text><text x="70" y="184" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">two wrong agents press one correct agent</text><rect x="70" y="200" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="84" y="226" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">A · wrong</text><text x="84" y="252" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="290" y="200" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="304" y="226" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">B · wrong</text><text x="304" y="252" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="510" y="200" width="200" height="62" rx="12" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/><text x="524" y="226" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">C · correct</text><text x="524" y="252" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer Y</text><path d="M 220 266 Q 220 300 300 300 Q 530 300 545 270" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-rose)"/><path d="M 390 266 Q 390 292 460 292 Q 525 292 552 270" fill="none" stroke="#B91C1C" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-rose)"/><text x="360" y="322" font-size="24" font-weight="400" fill="#B91C1C" text-anchor="middle">social pressure</text><text x="70" y="362" font-size="26" font-weight="700" fill="#475569" text-anchor="start">after the debate</text><rect x="70" y="376" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="84" y="402" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">A · wrong</text><text x="84" y="428" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="290" y="376" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="304" y="402" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">B · wrong</text><text x="304" y="428" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="510" y="376" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="524" y="402" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">C · flipped</text><text x="524" y="428" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="70" y="456" width="680" height="96" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><text x="90" y="492" font-size="30" font-weight="700" fill="#B91C1C" text-anchor="start">3 votes for X → wrong answer</text><text x="90" y="526" font-size="26" font-weight="400" fill="#475569" text-anchor="start">agreement is not evidence</text><rect x="820" y="112" width="740" height="468" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="850" y="154" font-size="34" font-weight="700" fill="#0F766E" text-anchor="start">B · Evidence-grounded trust</text><text x="850" y="184" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">claims are checked before the vote</text><rect x="850" y="200" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="864" y="226" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">A · wrong</text><text x="864" y="252" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="1070" y="200" width="200" height="62" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="1084" y="226" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">B · wrong</text><text x="1084" y="252" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer X</text><rect x="1290" y="200" width="200" height="62" rx="12" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/><text x="1304" y="226" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">C · correct</text><text x="1304" y="252" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Answer Y</text><text x="850" y="292" font-size="24" font-weight="700" fill="#B91C1C" text-anchor="start">contradicted</text><text x="1070" y="292" font-size="24" font-weight="700" fill="#B91C1C" text-anchor="start">contradicted</text><text x="1290" y="292" font-size="24" font-weight="700" fill="#0F766E" text-anchor="start">supported</text><text x="850" y="334" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">A</text><rect x="884" y="316" width="300" height="18" rx="9" fill="#F1F5F9"/><rect x="884" y="316" width="54" height="18" rx="9" fill="#B91C1C"/><text x="1200" y="334" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">0.18</text><text x="850" y="370" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">B</text><rect x="884" y="352" width="300" height="18" rx="9" fill="#F1F5F9"/><rect x="884" y="352" width="51" height="18" rx="9" fill="#B45309"/><text x="1200" y="370" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">0.17</text><text x="850" y="406" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">C</text><rect x="884" y="388" width="300" height="18" rx="9" fill="#F1F5F9"/><rect x="884" y="388" width="195" height="18" rx="9" fill="#0F766E"/><text x="1200" y="406" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">0.65</text><rect x="850" y="456" width="680" height="96" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="870" y="492" font-size="30" font-weight="700" fill="#0F766E" text-anchor="start">0.65 on Y beats 0.35 on X</text><text x="870" y="526" font-size="26" font-weight="400" fill="#475569" text-anchor="start">correct minority wins the weighted vote</text><text x="40" y="646" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="start">Failure-mode triad</text><rect x="40" y="664" width="270" height="170" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="60" y="704" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="start">verifier noise q*</text><text x="60" y="746" font-size="24" font-weight="400" fill="#475569" text-anchor="start">below q*, trust can</text><text x="60" y="778" font-size="24" font-weight="400" fill="#475569" text-anchor="start">amplify a wrong</text><text x="60" y="810" font-size="24" font-weight="400" fill="#475569" text-anchor="start">majority</text><rect x="325" y="664" width="270" height="170" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="345" y="704" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">redundancy ρ*</text><text x="345" y="746" font-size="24" font-weight="400" fill="#475569" text-anchor="start">shared claims are</text><text x="345" y="778" font-size="24" font-weight="400" fill="#475569" text-anchor="start">double-counted</text><text x="345" y="810" font-size="24" font-weight="400" fill="#475569" text-anchor="start">across agents</text><rect x="610" y="664" width="270" height="170" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/><text x="630" y="704" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">shared-error floor</text><text x="630" y="746" font-size="24" font-weight="400" fill="#475569" text-anchor="start">common wrong</text><text x="630" y="778" font-size="24" font-weight="400" fill="#475569" text-anchor="start">premises cap</text><text x="630" y="810" font-size="24" font-weight="400" fill="#475569" text-anchor="start">accuracy</text><rect x="920" y="664" width="640" height="170" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><text x="945" y="702" font-size="30" font-weight="700" fill="#B45309" text-anchor="start">Sign reversal</text><text x="945" y="740" font-size="26" font-weight="600" fill="#B91C1C" text-anchor="start">q &lt; q*  →  evidence can backfire</text><text x="945" y="776" font-size="26" font-weight="600" fill="#0F766E" text-anchor="start">q &gt; q*  →  evidence protects the minority</text><text x="945" y="812" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">the sign depends on verifier quality and overlap</text>
</svg>