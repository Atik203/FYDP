ont-weight="400" fill="#64748B" text-anchor="start">log + manifest</text><text x="40" y="875" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">D1 stores positions, rounds, and the trust trajectory; D2 stores every claim verdict; D3 stores the packaged record.</text>
