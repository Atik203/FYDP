<svg xmlns="http://www.w3.org/2000/svg" width="6000" height="3375" viewBox="0 0 1600 900">
<defs>
  <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/>
  </marker>
  <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
  </marker>
  <marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
  </marker>
  <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
  </marker>
  <style>text{font-family:Arial, Helvetica, sans-serif}</style>
  </defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="50" font-size="40" font-weight="700" fill="#1E3A8A" text-anchor="middle">Bounded trust: raw evidence → one softmax → simplex projection</text>
<text x="800" y="84" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">The operator runs after every scored round; neutral evidence is an identity, not a re-uniformization</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#E2E8F0" stroke-width="2"/>
<rect x="40" y="112" width="520" height="440" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="70" y="154" font-size="32" font-weight="700" fill="#1E3A8A" text-anchor="start">One update</text><rect x="65" y="172" width="470" height="96" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="90" y="210" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="start">Sᵢ ← Sᵢ + α·Vᵢ/nᵢ − β·Hᵢ/nᵢ</text><text x="90" y="248" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="start">T = Π(softmax(log S), 0.1, 0.9)</text><text x="70" y="306" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Vᵢ  supported claims</text><text x="70" y="342" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Hᵢ  contradicted claims</text><text x="70" y="378" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">nᵢ  distinct claims checked</text><text x="70" y="414" font-size="26" font-weight="400" fill="#475569" text-anchor="start">α = 0.5 · β = 0.3</text><text x="70" y="450" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">Π = projection onto the simplex</text><text x="70" y="486" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">floor 0.1 · ceiling 0.9</text><rect x="600" y="112" width="380" height="440" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="630" y="154" font-size="32" font-weight="700" fill="#0F766E" text-anchor="start">Operator chain</text><rect x="625" y="178" width="330" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="790" y="214" font-size="26" font-weight="600" fill="#0F172A" text-anchor="middle">raw score S</text><line x1="790" y1="236" x2="790" y2="252" stroke="#0F766E" stroke-width="2" marker-end="url(#a-teal)"/><rect x="625" y="254" width="330" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="790" y="290" font-size="26" font-weight="600" fill="#0F172A" text-anchor="middle">add evidence term</text><line x1="790" y1="312" x2="790" y2="328" stroke="#0F766E" stroke-width="2" marker-end="url(#a-teal)"/><rect x="625" y="330" width="330" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="790" y="366" font-size="26" font-weight="600" fill="#0F172A" text-anchor="middle">one softmax</text><line x1="790" y1="388" x2="790" y2="404" stroke="#0F766E" stroke-width="2" marker-end="url(#a-teal)"/><rect x="625" y="406" width="330" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="790" y="442" font-size="26" font-weight="600" fill="#0F172A" text-anchor="middle">simplex projection</text><line x1="790" y1="464" x2="790" y2="480" stroke="#0F766E" stroke-width="2" marker-end="url(#a-teal)"/><rect x="625" y="482" width="330" height="56" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="790" y="518" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">trust T, ΣT = 1</text><rect x="1020" y="112" width="540" height="440" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1050" y="154" font-size="32" font-weight="700" fill="#B45309" text-anchor="start">Feasible simplex (N = 3)</text><polygon points="1290,200 1470,490 1110,490" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><polygon points="1290,258 1416,461 1164,461" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="1290" y="188" font-size="26" font-weight="700" fill="#475569" text-anchor="middle">A</text><text x="1484" y="500" font-size="26" font-weight="700" fill="#475569" text-anchor="start">B</text><text x="1096" y="500" font-size="26" font-weight="700" fill="#475569" text-anchor="end">C</text><text x="1290" y="420" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">feasible</text><text x="1290" y="450" font-size="24" font-weight="400" fill="#0F766E" text-anchor="middle">0.1 ≤ Tᵢ · ΣT = 1</text><text x="1290" y="478" font-size="24" font-weight="400" fill="#B91C1C" text-anchor="middle">Tᵢ &lt; 0.1 excluded</text><circle cx="1291.8" cy="301.5" r="7" fill="#1E3A8A"/><text x="1292" y="264" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">T = (0.65, 0.18, 0.17)</text><text x="1040" y="522" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">for N = 3 the floor caps max weight at 0.8</text><text x="1040" y="544" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">ceiling 0.9 binds only for N = 2</text><rect x="40" y="580" width="493" height="220" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="64" y="620" font-size="28" font-weight="700" fill="#0F766E" text-anchor="start">Claim-count normalization</text><text x="64" y="660" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Repeating a claim cannot inflate</text><text x="64" y="694" font-size="26" font-weight="400" fill="#475569" text-anchor="start">support, harm, or the rate.</text><text x="64" y="728" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">8 copies → n = 1</text><text x="64" y="762" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">counts are distinct claims</text><rect x="554" y="580" width="493" height="220" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="578" y="620" font-size="28" font-weight="700" fill="#1E3A8A" text-anchor="start">Neutral evidence is identity</text><text x="578" y="660" font-size="26" font-weight="400" fill="#475569" text-anchor="start">V = H = 0 leaves T unchanged;</text><text x="578" y="694" font-size="26" font-weight="400" fill="#475569" text-anchor="start">no drift toward uniform.</text><text x="578" y="728" font-size="24" font-weight="600" fill="#475569" text-anchor="start">status: abstained_no_evidence</text><text x="578" y="762" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">abstention appends a flat row</text><rect x="1068" y="580" width="493" height="220" rx="12" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1092" y="620" font-size="28" font-weight="700" fill="#B45309" text-anchor="start">Status per scored round</text><text x="1092" y="660" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">updated</text><text x="1092" y="694" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">abstained_unanimous</text><text x="1092" y="728" font-size="26" font-weight="700" fill="#475569" text-anchor="start">abstained_no_evidence</text><text x="1092" y="762" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">null when use_trust = false</text><text x="40" y="850" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">Projection guarantees: min ≥ 0.1 · ΣT = 1 · max ≤ 0.9 (or 1/N when N·ceiling &lt; 1)</text>
</svg>