<svg xmlns="http://www.w3.org/2000/svg" width="6000" height="3375" viewBox="0 0 1600 900">
<defs>
  <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#1E3A8A"/>
  </marker>
  <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
  </marker>
  <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
  </marker>
  <marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
  </marker>
  <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
  <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
  </marker>
  <style>text{font-family:Arial, Helvetica, sans-serif}</style>
  </defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="50" font-size="40" font-weight="700" fill="#1E3A8A" text-anchor="middle">One claim set, three verdicts, three trust effects</text>
<text x="800" y="84" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">Worked example: “Does Drug X lower blood pressure in adults over 60?”</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#E2E8F0" stroke-width="2"/>
<rect x="40" y="120" width="340" height="150" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="62" y="158" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">Agent C · answer</text><text x="62" y="196" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start" font-style="italic">“Yes — but only in</text><text x="62" y="232" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start" font-style="italic">patients with condition Z.”</text><line x1="384" y1="195" x2="446" y2="195" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a-teal)"/><rect x="450" y="120" width="560" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="468" y="158" width="56" height="34" rx="17" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="496" y="183.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">c1</text><text x="542" y="182" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">Drug X lowers blood pressure.</text><line x1="1014" y1="175" x2="1056" y2="175" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><rect x="450" y="250" width="560" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="468" y="288" width="56" height="34" rx="17" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="496" y="313.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">c2</text><text x="542" y="298" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">The effect holds for every</text><text x="542" y="332" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">adult over 60.</text><line x1="1014" y1="305" x2="1056" y2="305" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><rect x="450" y="380" width="560" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="468" y="418" width="56" height="34" rx="17" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/><text x="496" y="443.4" font-size="24" font-weight="600" fill="#1E3A8A" text-anchor="middle">c3</text><text x="542" y="428" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">The effect is limited to</text><text x="542" y="462" font-size="26" font-weight="400" fill="#0F172A" text-anchor="start">patients with condition Z.</text><line x1="1014" y1="435" x2="1056" y2="435" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><rect x="1060" y="120" width="500" height="110" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/><text x="1082" y="160" font-size="28" font-weight="700" fill="#15803D" text-anchor="start" letter-spacing="0.5">SUPPORTED</text><text x="1082" y="194" font-size="24" font-weight="400" fill="#475569" text-anchor="start">two trials agree</text><text x="1538" y="160" font-size="28" font-weight="700" fill="#15803D" text-anchor="end">+ α / n</text><rect x="1060" y="250" width="500" height="110" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/><text x="1082" y="290" font-size="28" font-weight="700" fill="#B91C1C" text-anchor="start" letter-spacing="0.5">CONTRADICTED</text><text x="1082" y="324" font-size="24" font-weight="400" fill="#475569" text-anchor="start">no effect in the full cohort</text><text x="1538" y="290" font-size="28" font-weight="700" fill="#B91C1C" text-anchor="end">− β / n</text><rect x="1060" y="380" width="500" height="110" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1082" y="420" font-size="28" font-weight="700" fill="#475569" text-anchor="start" letter-spacing="0.5">UNVERIFIABLE</text><text x="1082" y="454" font-size="24" font-weight="400" fill="#475569" text-anchor="start">no subgroup evidence found</text><text x="1538" y="420" font-size="28" font-weight="700" fill="#475569" text-anchor="end">0 (still in n)</text><rect x="40" y="530" width="760" height="250" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="68" y="574" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="start">Net evidence term for Agent C</text><text x="68" y="618" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">Δlogit = (α·V − β·H) / n</text><text x="68" y="658" font-size="26" font-weight="400" fill="#475569" text-anchor="start">V = 1 supported · H = 1 contradicted · n = 3 checked</text><text x="68" y="704" font-size="30" font-weight="700" fill="#0F766E" text-anchor="start">= (0.5 − 0.3) / 3 = +0.067</text><text x="68" y="746" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">unverifiable claims add no reward or penalty, but stay in n</text><rect x="840" y="530" width="720" height="250" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><text x="868" y="574" font-size="30" font-weight="700" fill="#1E3A8A" text-anchor="start">How each verdict moves trust</text><text x="868" y="616" font-size="26" font-weight="600" fill="#15803D" text-anchor="start">supported  →  + α / n</text><text x="868" y="652" font-size="26" font-weight="600" fill="#B91C1C" text-anchor="start">contradicted  →  − β / n</text><text x="868" y="688" font-size="26" font-weight="600" fill="#475569" text-anchor="start">unverifiable  →  0</text><text x="868" y="734" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">deduplicated counts: repeating a claim</text><text x="868" y="764" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">cannot inflate support or harm</text><text x="40" y="850" font-size="24" font-weight="400" fill="#64748B" text-anchor="start">α = 0.5 · β = 0.3 (defaults) · one verdict per distinct claim</text>
</svg>