<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="50" font-size="40" font-weight="700" fill="#1E3A8A" text-anchor="middle">Debate round loop: when evidence enters and when trust is applied</text>
<text x="800" y="84" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">K = 3 revision rounds; a closing pass scores the final positions before aggregation</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#E2E8F0" stroke-width="2"/>
<rect x="27" y="120" width="285" height="200" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><path d="M 39 120 H 300 A 12 12 0 0 1 312 132 V 164 H 27 V 132 A 12 12 0 0 1 39 120 Z" fill="#1E3A8A"/><text x="45" y="151" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">R0</text><text x="105" y="150" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.95">positions</text><text x="45" y="198" font-size="24" font-weight="400" fill="#475569" text-anchor="start">3 independent answers</text><text x="45" y="232" font-size="24" font-weight="400" fill="#475569" text-anchor="start">each with tagged claims</text><text x="45" y="266" font-size="24" font-weight="400" fill="#475569" text-anchor="start">trust starts uniform</text><line x1="314" y1="230" x2="338" y2="230" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><rect x="342" y="120" width="285" height="200" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><path d="M 354 120 H 615 A 12 12 0 0 1 627 132 V 164 H 342 V 132 A 12 12 0 0 1 354 120 Z" fill="#0F766E"/><text x="360" y="151" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">R1</text><text x="420" y="150" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.95">evidence + trust</text><text x="360" y="198" font-size="24" font-weight="400" fill="#475569" text-anchor="start">route claims</text><text x="360" y="232" font-size="24" font-weight="400" fill="#475569" text-anchor="start">retrieve, verify</text><text x="360" y="266" font-size="24" font-weight="400" fill="#475569" text-anchor="start">update trust</text><text x="360" y="300" font-size="24" font-weight="400" fill="#475569" text-anchor="start">informs R2 prompt</text><line x1="629" y1="230" x2="653" y2="230" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a-teal)"/><rect x="657" y="120" width="285" height="200" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/><path d="M 669 120 H 930 A 12 12 0 0 1 942 132 V 164 H 657 V 132 A 12 12 0 0 1 669 120 Z" fill="#B45309"/><text x="675" y="151" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">R2</text><text x="735" y="150" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.95">revision</text><text x="675" y="198" font-size="24" font-weight="400" fill="#475569" text-anchor="start">agents see peer positions</text><text x="675" y="232" font-size="24" font-weight="400" fill="#475569" text-anchor="start">and current trust</text><text x="675" y="266" font-size="24" font-weight="700" fill="#B45309" text-anchor="start">one-shot injection</text><line x1="944" y1="230" x2="968" y2="230" stroke="#B45309" stroke-width="2.5" marker-end="url(#a-amber)"/><rect x="972" y="120" width="285" height="200" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><path d="M 984 120 H 1245 A 12 12 0 0 1 1257 132 V 164 H 972 V 132 A 12 12 0 0 1 984 120 Z" fill="#1E3A8A"/><text x="990" y="151" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">R3</text><text x="1050" y="150" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.95">clean revision</text><text x="990" y="198" font-size="24" font-weight="400" fill="#475569" text-anchor="start">injection removed</text><text x="990" y="232" font-size="24" font-weight="400" fill="#475569" text-anchor="start">final positions</text><text x="990" y="266" font-size="24" font-weight="400" fill="#475569" text-anchor="start">no new pressure</text><line x1="1259" y1="230" x2="1283" y2="230" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><rect x="1287" y="120" width="285" height="200" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><path d="M 1299 120 H 1560 A 12 12 0 0 1 1572 132 V 164 H 1287 V 132 A 12 12 0 0 1 1299 120 Z" fill="#0F766E"/><text x="1305" y="151" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Final</text><text x="1381" y="150" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.95">aggregate</text><text x="1305" y="198" font-size="24" font-weight="400" fill="#475569" text-anchor="start">closing trust pass</text><text x="1305" y="232" font-size="24" font-weight="400" fill="#475569" text-anchor="start">trust_for_positions</text><text x="1305" y="266" font-size="24" font-weight="400" fill="#475569" text-anchor="start">weighted vote</text><rect x="590" y="348" width="420" height="56" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6"/><text x="800" y="383" font-size="24" font-weight="600" fill="#B45309" text-anchor="middle">one-shot wrong consensus at R2</text><line x1="800" y1="348" x2="800" y2="324" stroke="#B45309" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-amber)"/><rect x="40" y="440" width="740" height="380" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/><text x="70" y="484" font-size="32" font-weight="700" fill="#1E3A8A" text-anchor="start">Trust trajectory</text><line x1="120" y1="750" x2="720" y2="750" stroke="#E2E8F0" stroke-width="2"/><text x="108" y="758" font-size="22" font-weight="400" fill="#64748B" text-anchor="end">0.0</text><line x1="120" y1="635" x2="720" y2="635" stroke="#E2E8F0" stroke-width="2"/><text x="108" y="643" font-size="22" font-weight="400" fill="#64748B" text-anchor="end">0.5</text><line x1="120" y1="520" x2="720" y2="520" stroke="#E2E8F0" stroke-width="2"/><text x="108" y="528" font-size="22" font-weight="400" fill="#64748B" text-anchor="end">1.0</text><line x1="150" y1="750" x2="150" y2="756" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="780" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">R0</text><line x1="292.5" y1="750" x2="292.5" y2="756" stroke="#CBD5E1" stroke-width="2"/><text x="292.5" y="780" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">R1</text><line x1="435" y1="750" x2="435" y2="756" stroke="#CBD5E1" stroke-width="2"/><text x="435" y="780" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">R2</text><line x1="577.5" y1="750" x2="577.5" y2="756" stroke="#CBD5E1" stroke-width="2"/><text x="577.5" y="780" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">R3</text><line x1="720" y1="750" x2="720" y2="756" stroke="#CBD5E1" stroke-width="2"/><text x="720" y="780" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">final</text><polyline points="150,673.41 292.5,694.8 435,701.7 577.5,704 720,708.6" fill="none" stroke="#B91C1C" stroke-width="3"/><circle cx="150" cy="673.41" r="5" fill="#B91C1C"/><circle cx="292.5" cy="694.8" r="5" fill="#B91C1C"/><circle cx="435" cy="701.7" r="5" fill="#B91C1C"/><circle cx="577.5" cy="704" r="5" fill="#B91C1C"/><circle cx="720" cy="708.6" r="5" fill="#B91C1C"/><polyline points="150,673.41 292.5,699.4 435,706.3 577.5,708.6 720,710.9" fill="none" stroke="#B45309" stroke-width="3"/><circle cx="150" cy="673.41" r="5" fill="#B45309"/><circle cx="292.5" cy="699.4" r="5" fill="#B45309"/><circle cx="435" cy="706.3" r="5" fill="#B45309"/><circle cx="577.5" cy="708.6" r="5" fill="#B45309"/><circle cx="720" cy="710.9" r="5" fill="#B45309"/><polyline points="150,673.41 292.5,625.8 435,612 577.5,607.4 720,600.5" fill="none" stroke="#0F766E" stroke-width="3"/><circle cx="150" cy="673.41" r="5" fill="#0F766E"/><circle cx="292.5" cy="625.8" r="5" fill="#0F766E"/><circle cx="435" cy="612" r="5" fill="#0F766E"/><circle cx="577.5" cy="607.4" r="5" fill="#0F766E"/><circle cx="720" cy="600.5" r="5" fill="#0F766E"/><text x="600" y="512" font-size="24" font-weight="700" fill="#B91C1C" text-anchor="start">A</text><text x="632" y="512" font-size="24" font-weight="700" fill="#B45309" text-anchor="start">B</text><text x="664" y="512" font-size="24" font-weight="700" fill="#0F766E" text-anchor="start">C</text><text x="70" y="800" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">rows are simplex vectors; abstentions append a flat row</text><rect x="820" y="440" width="740" height="380" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="850" y="484" font-size="32" font-weight="700" fill="#0F766E" text-anchor="start">Final weighted vote</text><text x="850" y="552" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">A</text><rect x="884" y="534" width="360" height="26" rx="13" fill="#F1F5F9"/><rect x="884" y="534" width="64.8" height="26" rx="13" fill="#B91C1C"/><text x="1260" y="554" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start">0.18</text><text x="1320" y="554" font-size="24" font-weight="400" fill="#475569" text-anchor="start">on X</text><text x="850" y="616" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">B</text><rect x="884" y="598" width="360" height="26" rx="13" fill="#F1F5F9"/><rect x="884" y="598" width="61.2" height="26" rx="13" fill="#B45309"/><text x="1260" y="618" font-size="26" font-weight="700" fill="#B45309" text-anchor="start">0.17</text><text x="1320" y="618" font-size="24" font-weight="400" fill="#475569" text-anchor="start">on X</text><text x="850" y="680" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">C</text><rect x="884" y="662" width="360" height="26" rx="13" fill="#F1F5F9"/><rect x="884" y="662" width="234" height="26" rx="13" fill="#0F766E"/><text x="1260" y="682" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">0.65</text><text x="1320" y="682" font-size="24" font-weight="400" fill="#475569" text-anchor="start">on Y (correct)</text><rect x="850" y="726" width="680" height="60" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="870" y="763" font-size="28" font-weight="700" fill="#0F766E" text-anchor="start">Y wins: 0.65 &gt; 0.35</text><text x="70" y="862" font-size="20" font-weight="400" fill="#0F172A" text-anchor="start"></text>
