<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="800" y="50" font-size="40" font-weight="700" fill="#1E3A8A" text-anchor="middle">System context: trust-calibrated deliberation framework</text>
<text x="800" y="84" font-size="26" font-weight="400" fill="#475569" text-anchor="middle">External actors, requests, and the result package returned to the user</text>
<line x1="40" y1="100" x2="1560" y2="100" stroke="#E2E8F0" stroke-width="2"/>
<rect x="520" y="250" width="560" height="300" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/><text x="540" y="240" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">system boundary</text><text x="800" y="304" font-size="32" font-weight="700" fill="#1E3A8A" text-anchor="middle">Trust-calibrated</text><text x="800" y="342" font-size="32" font-weight="700" fill="#1E3A8A" text-anchor="middle">deliberation framework</text><text x="800" y="388" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">confidence gate → 3-agent debate</text><text x="800" y="422" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">claim-level evidence + bounded trust</text><text x="800" y="456" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">trust-weighted aggregation</text><text x="800" y="490" font-size="24" font-weight="400" fill="#475569" text-anchor="middle">K = 3 revision rounds</text><rect x="40" y="255" width="300" height="140" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><text x="62" y="292" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="start">User / eval harness</text><text x="62" y="324" font-size="24" font-weight="400" fill="#475569" text-anchor="start">questions · scores</text><text x="62" y="356" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">agents never see gold</text><rect x="650" y="110" width="300" height="84" rx="12" fill="#EEF2FF" stroke="#1E3A8A" stroke-width="2"/><text x="672" y="146" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="start">vLLM model server</text><text x="672" y="176" font-size="22" font-weight="400" fill="#475569" text-anchor="start">3 agents · OpenAI API</text><rect x="1220" y="145" width="340" height="430" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="1240" y="181" font-size="26" font-weight="700" fill="#0F766E" text-anchor="start">Evidence sources</text><rect x="1240" y="200" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="1256" y="224" font-size="24" font-weight="700" fill="#0F766E" text-anchor="start">PubMed</text><text x="1256" y="248" font-size="20" font-weight="400" fill="#475569" text-anchor="start">bio / clinical</text><rect x="1240" y="270" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="1256" y="294" font-size="24" font-weight="700" fill="#0F766E" text-anchor="start">arXiv</text><text x="1256" y="318" font-size="20" font-weight="400" fill="#475569" text-anchor="start">physics/chem · math/CS</text><rect x="1240" y="340" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="1256" y="364" font-size="24" font-weight="700" fill="#0F766E" text-anchor="start">Semantic Scholar</text><text x="1256" y="388" font-size="20" font-weight="400" fill="#475569" text-anchor="start">all domains</text><rect x="1240" y="410" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="1256" y="434" font-size="24" font-weight="700" fill="#0F766E" text-anchor="start">OpenAlex</text><text x="1256" y="458" font-size="20" font-weight="400" fill="#475569" text-anchor="start">fallback</text><text x="1240" y="512" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">routed per claim, not per agent</text><text x="1240" y="540" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">dedup by DOI / arXiv / title</text><rect x="540" y="665" width="520" height="115" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/><text x="566" y="704" font-size="28" font-weight="700" fill="#0F766E" text-anchor="start">Result package</text><text x="566" y="738" font-size="24" font-weight="400" fill="#475569" text-anchor="start">answer · citations · trust trajectory</text><text x="566" y="770" font-size="24" font-weight="400" fill="#475569" text-anchor="start">reasoning trace</text><line x1="344" y1="300" x2="516" y2="300" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><text x="430" y="290" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">question</text><line x1="516" y1="370" x2="348" y2="370" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#a-navy)"/><text x="430" y="358" font-size="22" font-weight="400" fill="#1E3A8A" text-anchor="middle">scores</text><path d="M800 198 V246" fill="none" stroke="#1E3A8A" stroke-width="2.5" marker-start="url(#a-navy)" marker-end="url(#a-navy)"/><text x="815" y="226" font-size="22" font-weight="400" fill="#475569" text-anchor="start">prompts ↔ completions</text><path d="M1216 360 H1084" fill="none" stroke="#0F766E" stroke-width="2.5" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/><text x="1150" y="350" font-size="22" font-weight="400" fill="#0F766E" text-anchor="middle">evidence</text><line x1="800" y1="554" x2="800" y2="661" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a-teal)"/><text x="815" y="610" font-size="22" font-weight="400" fill="#0F766E" text-anchor="start">package</text><path d="M540 720 H400 V430 H190 V399" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#a-teal)"/><text x="410" y="700" font-size="22" font-weight="400" fill="#0F766E" text-anchor="end">to user</text><text x="40" y="850" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">Ground truth stays outside the agents; only the evaluation harness scores the final answer.</text><text x="1560" y="850" font-size="22" font-weight="400" fill="#64748B" text-anchor="end">double arrows = request / response</text>
</svg>